# S003 pre-registration for the harness gate (train.py refuses a run without it; the queue passes
# --require-committed, so it must be committed unchanged). The full pre-registration is experiments/S003_adamw/notes.txt and experiments/SCREENS.txt (C1-C9; C1-b, which withdrew C1-a)
# AT THE SAME COMMIT; where this summary and those files differ, they govern.
id: S003
hypothesis: >-
  Q: at 5M and 250M slots, with each optimizer at its own tuned LRs (AdamW by E2's stage A-C search at seed 1), does AdamW with cautious WD on the matrix parameters (optim.kind adamw) change held-out chat bpb relative to NorMuon? (LEDGER row 19, P-119)
metric: >-
  F(CHAT) = data_prep/bpb.py bits per byte of the run's FINAL checkpoint on the oasst2 eval set (eval sets v0, fp32, batch 16384 tokens, all windows); guard F(PROSE) = cccc + gutenberg + wikimedia pooled (SCREENS.txt C5). Seed-1 runs only select an LR (C3) and are never in a paired analysis.
decision_rule: >-
  SCREENS.txt C7: d_s = F_arm,s - F_BASE,s at paired seeds 101..100+k (k from E3 results.json, C4); thr_m = t(0.975, df_ref) * SD_ref / sqrt(k); BETTER/WORSE need |dbar| > thr and every d_s on that side; EQUAL needs |dbar| + thr < 1% of BASE's mean; NOMINATE = BETTER_CHAT and not WORSE_PROSE, REJECT = WORSE_CHAT, TIE = EQUAL_CHAT and not WORSE_PROSE, GUARD-FAIL, else INCONCLUSIVE; a diverged arm seed scores +inf. LR: E2's stage A-C search repeated with optim.kind adamw at seed 1 (S003 notes, replaces C3's g-check); NorMuon keeps LR5.
